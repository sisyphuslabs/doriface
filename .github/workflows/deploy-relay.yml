name: Deploy relay

on:
  push:
    branches: [dev]
    paths:
      - apps/relay/**
      - packages/relay-client/**
      - packages/client/**
      - bun.lock
      - .github/workflows/deploy-relay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # wrangler needs Node 22 or newer.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The same gate as CI's Check job: a commit that fails typecheck, lint, format or tests never deploys.
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.17/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 82ec44043f6894bfdb716b979b87cda43fd7fa46b0104e7b7bd93e64d1a9b877
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: wrangler deploy
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
      - name: Wait for healthz
        run: |
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if body=$(curl -fsS --max-time 10 https://relay-doriface.omo.dev/healthz) &&
              echo "$body" | jq -e '.ok == true' > /dev/null; then
              echo "healthz: $body"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://relay-doriface.omo.dev/healthz did not return ok:true within 2 minutes"
          exit 1
