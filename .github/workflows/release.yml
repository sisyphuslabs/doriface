name: Release

# A vX.Y.Z tag builds every artifact into a draft release, smoke-tests the uploaded files and then publishes it.
# A manual dispatch builds the same set into a draft release and leaves it a draft, so the pipeline can be proven
# without publishing anything. Either way the version must match apps/desktop/package.json (release-version.ts).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build into a draft release, such as 0.2.0 or 0.2.0-rc.1 (apps/desktop/package.json's version, optionally with a prerelease suffix)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  # Never cancel a release half way through an upload.
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.4.4
  NODE_VERSION: 24

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the version from apps/desktop/package.json
        id: resolve
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: bun .github/scripts/release-version.ts "$REQUESTED"
      # Fail before an hour of builds rather than at upload: a published release is never rebuilt in place.
      - name: The release is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error title=Release exists::$TAG is already published. Back up and delete that release first to rebuild it."
            exit 1
          fi
      - name: Workflow summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Release version"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Version | ${VERSION:-not resolved} |"
            echo "| Trigger | $EVENT |"
            echo "| Commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-15, os: mac, arch: arm64, targets: dmg zip, files: dmg zip }
          - { name: macOS x64, runner: macos-15-intel, os: mac, arch: x64, targets: dmg zip, files: dmg zip }
          - { name: Windows x64, runner: windows-2025, os: win, arch: x64, targets: nsis, files: exe }
          - { name: Windows arm64, runner: windows-11-arm, os: win, arch: arm64, targets: nsis, files: exe }
          - { name: Linux x64, runner: ubuntu-24.04, os: linux, arch: x64, targets: AppImage deb, files: AppImage deb }
          - {
              name: Linux arm64,
              runner: ubuntu-24.04-arm,
              os: linux,
              arch: arm64,
              targets: AppImage deb,
              files: AppImage deb,
            }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Code signing is off. To turn it on, add these repository secrets, uncomment the lines, and drop the ad-hoc
      # identity and hardenedRuntime overrides in the Package step:
      # macOS (Developer ID certificate as base64 .p12, plus notarization):
      #   CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Windows (Authenticode certificate as base64 .pfx):
      #   WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      #   WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build the web client, the app and the host
        working-directory: apps/desktop
        run: |
          bun run build:web
          bun run build
          bun run build:host "${{ matrix.os }}-${{ matrix.arch }}"
      - name: Package (electron-builder ${{ matrix.targets }})
        working-directory: apps/desktop
        run: |
          args=(--${{ matrix.os }} ${{ matrix.targets }} --${{ matrix.arch }} --publish never)
          args+=("-c.extraMetadata.version=$VERSION")
          if [ "${{ matrix.os }}" = mac ]; then
            # Unsigned: an ad-hoc signature, which Apple silicon needs to run the app at all. The hardened runtime would
            # make library validation reject Electron's framework under an ad-hoc signature.
            args+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false")
          fi
          bun x electron-builder "${args[@]}"
      - name: The bundle's signature verifies
        if: matrix.os == 'mac'
        working-directory: apps/desktop/dist/release
        run: codesign --verify --deep --strict --verbose=2 mac*/doriface.app
      - name: Collect ${{ matrix.files }}
        working-directory: apps/desktop/dist/release
        run: |
          shopt -s nullglob
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          for ext in ${{ matrix.files }}; do
            found=(*"$VERSION"*."$ext")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error title=Missing artifact::expected one .$ext for $VERSION, found ${#found[@]}"
              ls -la
              exit 1
            fi
            cp "${found[0]}" "$out/"
          done
          ls -la "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Desktop ${{ matrix.name }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Runner | ${{ matrix.runner }} (${{ runner.os }} ${{ runner.arch }}) |"
            echo "| Version | $VERSION |"
            echo "| Targets | ${{ matrix.targets }} |"
            echo
            for file in "$RUNNER_TEMP"/out/*; do
              [ -f "$file" ] && echo "- \`$(basename "$file")\` ($(wc -c < "$file" | tr -d ' ') bytes)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build apps/web
        run: bun run --cwd apps/web build
      - name: Zip the build
        working-directory: apps/web/dist
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          zip -qrX "$RUNNER_TEMP/out/doriface-web-$VERSION.zip" .
          unzip -l "$RUNNER_TEMP/out/doriface-web-$VERSION.zip" | tail -n 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Web"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Version | $VERSION |"
            echo "| Artifact | doriface-web-$VERSION.zip |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Draft release
    needs: [version, desktop, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum -- * | sort -k 2 > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: bun .github/scripts/release-notes.ts "$VERSION" assets > "$RUNNER_TEMP/notes.md"
      - name: Create or refresh the draft release
        run: |
          pre=()
          [ "$PRERELEASE" = true ] && pre=(--prerelease)
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            false)
              echo "::error title=Release exists::$TAG is already published; it is never rebuilt in place."
              exit 1
              ;;
            true)
              # A re-run: replace the earlier run's assets so nothing stale stays attached.
              gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
                gh release delete-asset "$TAG" "$name" --yes
              done
              gh release edit "$TAG" --title "doriface $TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" "${pre[@]}"
              ;;
            *)
              gh release create "$TAG" --draft --title "doriface $TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" "${pre[@]}"
              ;;
          esac
          gh release upload "$TAG" assets/*
      - name: Every asset is attached at its size
        run: |
          (cd assets && for file in *; do echo "$file $(wc -c < "$file" | tr -d ' ')"; done) | sort > "$RUNNER_TEMP/local.txt"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > "$RUNNER_TEMP/remote.txt"
          diff -u "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/remote.txt"
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Draft release $TAG"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Prerelease | $PRERELEASE |"
            echo "| Commit | $GITHUB_SHA |"
            echo
            echo '```'
            cat assets/SHA256SUMS.txt 2>/dev/null || echo "no checksums"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-linux:
    name: Smoke Linux x64 AppImage
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # A draft release is only visible to a token that can write to the repository.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.17/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 82ec44043f6894bfdb716b979b87cda43fd7fa46b0104e7b7bd93e64d1a9b877
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Download the AppImage from the draft release
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          gh release download "$TAG" --pattern SHA256SUMS.txt --pattern "doriface-$VERSION-x86_64.AppImage"
          sha256sum --check --ignore-missing --strict SHA256SUMS.txt
          chmod +x "doriface-$VERSION-x86_64.AppImage"
          echo "APPIMAGE=$RUNNER_TEMP/dl/doriface-$VERSION-x86_64.AppImage" >> "$GITHUB_ENV"
      # The AppImage runtime mounts itself with FUSE 2; Ubuntu's AppArmor blocks the user namespaces Chromium's sandbox
      # needs, and the app keeps its sandbox on.
      - name: FUSE and the Chromium sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The AppImage launches and attaches a terminal
        working-directory: apps/desktop
        env:
          DORIFACE_E2E_EXECUTABLE: ${{ env.APPIMAGE }}
          DEBUG: pw:browser
        run: xvfb-run --auto-servernum bun run test:e2e e2e/launch.e2e.ts e2e/terminal.e2e.ts
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Smoke: Linux x64 AppImage from the draft release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| File | doriface-$VERSION-x86_64.AppImage |"
            echo "| Checks | launch.e2e.ts, terminal.e2e.ts against the downloaded file |"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-mac:
    name: Smoke macOS arm64 zip
    needs: [version, release]
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Download the zip from the draft release
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          zip="doriface-$VERSION-arm64-mac.zip"
          gh release download "$TAG" --pattern SHA256SUMS.txt --pattern "$zip"
          grep "  $zip\$" SHA256SUMS.txt | shasum -a 256 --check
          ditto -x -k "$zip" app
      - name: The app is signed, carries the version and starts
        working-directory: ${{ runner.temp }}/dl/app
        run: |
          codesign --verify --deep --strict --verbose=2 doriface.app
          bundled=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" doriface.app/Contents/Info.plist)
          if [ "$bundled" != "$VERSION" ]; then
            echo "::error::the app says $bundled, expected $VERSION"
            exit 1
          fi
          # Chromium prints this line once its browser process is up; wait for it, bounded, then check it is still running.
          doriface.app/Contents/MacOS/doriface --remote-debugging-port=0 > launch.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            grep -q "DevTools listening on" launch.log && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat launch.log
          grep -q "DevTools listening on" launch.log
          kill -0 "$pid"
          kill "$pid"
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Smoke: macOS arm64 zip from the draft release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| File | doriface-$VERSION-arm64-mac.zip |"
            echo "| Checks | checksum, codesign --verify, bundle version, launch |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [version, smoke-linux, smoke-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Publish the draft
        run: gh release edit "$TAG" --draft=false
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Publish $TAG"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG |"
          } >> "$GITHUB_STEP_SUMMARY"
