name: Deploy landing

# Serves apps/landing at doriterm.com as Workers static assets (apps/landing/wrangler.jsonc), with no Worker code.
# Run by hand: the doriterm.com zone record and custom domain are created once, in the Cloudflare account the repository
# secrets belong to. The page's primary action opens https://app.doriterm.com, so the job refuses to deploy until that
# origin answers. The probe after the deploy fails the job but cannot undo it: `wrangler rollback` restores the previous
# version.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4
  WRANGLER: wrangler@4.158.0

jobs:
  deploy:
    name: Deploy doriterm.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the app origin
        run: curl -fsS --max-time 10 -o /dev/null https://app.doriterm.com/
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build apps/landing
        run: bun run --cwd apps/landing build
      - name: Deploy
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx "$WRANGLER" deploy
      - name: Probe
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://doriterm.com/ | grep -q "on every screen"; then
              echo "doriterm.com answers with the landing page"
              exit 0
            fi
            sleep 10
          done
          echo "doriterm.com did not answer with the landing page"
          exit 1
